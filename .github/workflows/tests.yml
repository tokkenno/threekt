name: Tests

# Runs on every push to any branch, on every pull request and on demand.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (JVM and browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # Browser tests run in headless Chrome, which the Ubuntu runner provides, with SwiftShader WebGL2
      # configured in engine/core/karma.config.d.
      - name: Run engine tests
        run: ./gradlew :engine:core:jvmTest :engine:core:jsTest --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-test-reports
          path: |
            engine/*/build/reports/tests
            engine/*/build/test-results
          if-no-files-found: ignore
