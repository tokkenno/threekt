name: JVM headless rendering

on:
  push:
    branches: [master]
  pull_request:

jobs:
  textured-obj:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Mesa EGL and OpenGL ES
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri
      - name: Render with Mesa software EGL
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./gradlew :jvmApp:installDist
          env -u DISPLAY -u WAYLAND_DISPLAY -u EGL_PLATFORM -u LIBGL_ALWAYS_SOFTWARE \
            jvmApp/build/install/jvmApp/bin/jvmApp --headless --software --example webgl_loader_obj \
            --width 640 --height 480 --screenshot headless-obj.png | tee headless-renderer.log
          grep -Ei 'llvmpipe|softpipe|swrast' headless-renderer.log
      - name: Render with ANGLE and WARP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./gradlew.bat :jvmApp:installDist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Windows runner's Chrome installation ships a matching pair of ANGLE DLLs.
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application'
          $egl = Get-ChildItem -Path $chrome -Filter libEGL.dll -Recurse -File |
            Where-Object { Test-Path (Join-Path $_.DirectoryName 'libGLESv2.dll') } |
            Select-Object -First 1
          if (-not $egl) { throw "Could not find paired ANGLE libraries in $chrome" }
          $env:PATH = "$($egl.DirectoryName);$env:PATH"
          $output = & ./jvmApp/build/install/jvmApp/bin/jvmApp.bat --headless --software --example webgl_loader_obj `
            --angle-dir "$($egl.DirectoryName)" --width 640 --height 480 --screenshot headless-obj.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output | Write-Host
          if (($output -join "`n") -notmatch 'WARP|Microsoft Basic Render Driver') { throw "Expected ANGLE WARP" }
      - name: Verify PNG dimensions and textures
        run: java -Djava.awt.headless=true .github/scripts/VerifyHeadlessObj.java headless-obj.png 640 480
